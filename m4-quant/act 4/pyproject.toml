[project]
name = "act-4"
version = "0.1.0"
description = "Actividad 4.5: Similitud en textos mediante TF-IDF y similitud coseno"
readme = "README.md"
authors = [
    { name = "Daniel Monroy", email = "fernandodms04@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13.0",
    "great-tables>=1.0.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "jupytext>=1.19.6",
    "markovify>=0.9.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.7.0",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
]

[project.scripts]
act-4 = "act_4:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
